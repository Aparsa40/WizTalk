name: WizTalk CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wiztalk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WizTalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify production output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/server.cjs

  runtime:
    name: Runtime & API smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start WizTalk server
        run: |
          npm run start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              echo "WizTalk server is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "WizTalk server did not become ready."
          cat server.log
          exit 1

      - name: Health endpoint
        run: |
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Characters endpoint
        run: |
          curl -fsS http://127.0.0.1:3000/api/characters

      - name: Models endpoint
        run: |
          curl -fsS http://127.0.0.1:3000/api/models

      - name: Invalid chat request must be rejected
        run: |
          status=$(curl -s -o /tmp/chat-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://127.0.0.1:3000/api/chat)

          echo "HTTP status: $status"
          cat /tmp/chat-response.json

          if [ "$status" -lt 400 ] || [ "$status" -ge 500 ]; then
            echo "Expected a client-side validation error (4xx)."
            exit 1
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wiztalk-server-log
          path: server.log
          if-no-files-found: ignore

  security:
    name: Client secret exposure check
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Search source for client-side API key storage
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            'localStorage\.(setItem|getItem).*([Aa][Pp][Ii].*[Kk]ey|OPENAI_API_KEY|GEMINI_API_KEY)|([Aa][Pp][Ii].*[Kk]ey|OPENAI_API_KEY|GEMINI_API_KEY).*localStorage\.' \
            src; then
            echo "Potential client-side API key storage detected."
            exit 1
          fi

          echo "No obvious client-side API key storage detected."

      - name: Verify provider secrets are server-side
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            'OPENAI_API_KEY|GEMINI_API_KEY' \
            src; then
            echo "Provider secret names detected inside client source."
            exit 1
          fi

          echo "Provider secret names are not present in client source."